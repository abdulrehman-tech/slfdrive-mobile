name: slfdrive
description: "SLF Drive - Car Rental & Driver Services Platform"
publish_to: 'none'

version: 1.0.1+13

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & DI
  provider: ^6.1.5
  get_it: ^8.2.0
  
  # Navigation
  go_router: ^14.6.2
  
  # Network
  dio: ^5.9.0
  connectivity_plus: ^7.0.0
  
  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  hive_flutter: ^1.1.0
  flutter_dotenv: ^5.2.1
  
  # UI & Responsive
  flutter_screenutil: ^5.9.3

  # UI Components
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  iconsax_flutter: ^1.0.1
  shimmer: ^3.0.0
  skeletonizer: ^2.1.0
  font_awesome_flutter: ^10.7.0
  
  # Maps & Location
  google_maps_flutter: ^2.9.0
  google_maps_flutter_web: ^0.5.10
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  # Used on web to inject the Maps JS SDK at runtime (keeps the API key out
  # of `web/index.html`).
  web: ^1.1.0
  
  # Date & Time
  intl: ^0.20.2
  easy_localization: ^3.0.8
  syncfusion_flutter_datepicker: ^28.2.7

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.3.6
  firebase_analytics: ^11.4.6
  firebase_crashlytics: ^4.3.6
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # File Handling
  file_picker: ^8.0.0
  image_picker: ^1.2.0

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  package_info_plus: ^8.3.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  intl_phone_field: ^3.2.0
  pinput: ^6.0.1
  flutter_displaymode: ^0.7.0

  # Cache Management
  flutter_cache_manager: ^3.4.1
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  build_runner: ^2.4.13

# ---------------------------------------------------------------------------
# App launcher icons (Android + iOS).
# Master art: assets/icon/app_icon.png (1024×1024, no transparency for iOS).
# Regenerate after changing the master:  dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# ---------------------------------------------------------------------------
# Native launch splash. Regenerate after changing:
#   dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/slf-logo.png
  color_dark: "#0C2485"
  image_dark: assets/images/slf-logo-white.png
  android_12:
    image: assets/images/slf-logo.png
    color: "#FFFFFF"
    image_dark: assets/images/slf-logo-white.png
    color_dark: "#0C2485"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/icons/
    - assets/images/
    - assets/images/brands/
    - assets/lottie/
    - assets/translations/
    - assets/web/icons/
    - assets/web/images/
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/Open_Sans/static/OpenSans-Regular.ttf
        - asset: assets/fonts/Open_Sans/static/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Open_Sans/static/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Open_Sans/static/OpenSans-Light.ttf
          weight: 300

    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
          weight: 300
